[package]
name = "ariadne"
version = "0.3.0"
description = "Ariadne for Mac"
authors = ["Ariadne contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "ariadne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
