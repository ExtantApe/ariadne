name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: /usr/bin/python3 tests/test_ariadne.py
      - name: Private terms for the leak check
        env:
          TERMS: ${{ secrets.LEAK_TERMS }}
        run: if [ -n "$TERMS" ]; then printf '%s\n' "$TERMS" > "$HOME/.theseus-private-terms"; fi
      - run: bash scripts/leak-check.sh
      - run: bash scripts/check-shared.sh
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ariadne-desktop build
      - run: pnpm exec playwright install webkit
      - run: pnpm --filter ariadne-desktop e2e
      - run: pnpm --filter ariadne-desktop tauri build --no-bundle
